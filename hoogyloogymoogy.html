<!DOCTYPE html>
<html>
  <head>
    <title>Tomato Can 360 - Blog Webmaster Admin</title>
    <style>
      body {
        background-color: #000080;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
      }
      .admin-panel {
        background-color: #000050;
        border: 3px outset #ffffff;
        box-shadow: 4px 4px 0px #000020;
        max-width: 750px;
        margin: 0 auto;
        padding: 20px;
      }
      h1, h2 {
        font-family: "Times New Roman", Times, serif;
        margin-top: 0;
      }
      label {
        display: block;
        font-weight: bold;
        color: #ffff00;
        margin-top: 12px;
        margin-bottom: 4px;
        font-size: 14px;
      }
      input[type="text"], textarea {
        width: 100%;
        box-sizing: border-box;
        background-color: #000022;
        color: #ffffff;
        border: 2px inset #ffffff;
        padding: 6px 8px;
        font-family: Arial, sans-serif;
        font-size: 14px;
      }
      .btn {
        background-color: #c0c0c0;
        color: #000000;
        border: 3px outset #ffffff;
        font-weight: bold;
        font-size: 15px;
        padding: 6px 18px;
        margin-top: 15px;
        cursor: pointer;
      }
      .btn:active {
        border: 3px inset #ffffff;
      }
      .btn-del {
        background-color: #ff3333;
        color: #ffffff;
        border: 2px outset #ffffff;
        cursor: pointer;
        padding: 3px 8px;
        font-size: 11px;
        font-weight: bold;
      }
      .post-manage-card {
        background-color: #000030;
        border: 1px solid #666699;
        padding: 10px;
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      a { color: #00ffff; }
    </style>
  </head>
  <body>
    <div class="admin-panel">
      <h1>Tomato Can 360 <font color="#FF6347">Post Creator</font></h1>
      <p><a href="blog.html">&larr; Back to Public Blog</a></p>
      <hr color="#c0c0c0" size="2" />

      <h2>Create New Blog Post</h2>
      <form id="createPostForm">
        <label for="postTitle">Post Title:</label>
        <input type="text" id="postTitle" placeholder="e.g. Two Step Street View!" required />

        <label for="postAuthor">Author Name:</label>
        <input type="text" id="postAuthor" value="TomatoCan360 Owner" required />

        <label for="postDate">Display Date:</label>
        <input type="text" id="postDate" placeholder="e.g. 9/7/26 (or leave blank for today's date)" />

        <label for="postContent">Content / Story:</label>
        <textarea id="postContent" rows="8" placeholder="Type your blog update here..." required></textarea>

        <div style="margin-top: 12px;">
          <input type="checkbox" id="postFresh" checked />
          <label for="postFresh" style="display:inline; color:#ffffff;">Mark with "SUPER FRESH" Badge</label>
        </div>

        <button type="submit" class="btn" id="submitBtn">Publish Post to Blog</button>
      </form>

      <br /><br />
      <hr color="#c0c0c0" size="2" />

      <h2>Manage Existing Posts</h2>
      <div id="postsList">
        <p><font color="#8888aa">Loading your posts...</font></p>
      </div>
    </div>

    <!-- FIREBASE MODULE SCRIPT -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
      import { getDatabase, ref, push, remove, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBg56pode30fZyUd4Rcr8XHfXmc7rKJIgw",
        authDomain: "tomatocan360-comments.firebaseapp.com",
        databaseURL: "https://tomatocan360-comments-default-rtdb.firebaseio.com",
        projectId: "tomatocan360-comments",
        storageBucket: "tomatocan360-comments.firebasestorage.app",
        messagingSenderId: "134319569778",
        appId: "1:134319569778:web:d658fd0136447cac883beb",
        measurementId: "G-0PS9FL17FW"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      // FORM SUBMIT
      document.getElementById("createPostForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const title = document.getElementById("postTitle").value.trim();
        const author = document.getElementById("postAuthor").value.trim();
        let date = document.getElementById("postDate").value.trim();
        const content = document.getElementById("postContent").value.trim();
        const fresh = document.getElementById("postFresh").checked;

        if (!title || !content) {
          alert("Please fill in both the title and post content!");
          return;
        }

        if (!date) {
          const now = new Date();
          date = `${now.getMonth() + 1}/${now.getDate()}/${now.getFullYear().toString().slice(-2)}`;
        }

        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Publishing...";

        push(ref(db, "posts"), {
          title: title,
          author: author || "TomatoCan360 Owner",
          date: date,
          content: content,
          fresh: fresh,
          timestamp: Date.now()
        }).then(() => {
          alert("Blog post published successfully!");
          document.getElementById("postTitle").value = "";
          document.getElementById("postContent").value = "";
          document.getElementById("postDate").value = "";
          submitBtn.disabled = false;
          submitBtn.innerText = "Publish Post to Blog";
        }).catch((err) => {
          alert("Error: " + err.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "Publish Post to Blog";
        });
      });

      // LIST EXISTING POSTS & DELETE SUPPORT
      const postsContainer = document.getElementById("postsList");
      onValue(ref(db, "posts"), (snapshot) => {
        postsContainer.innerHTML = "";
        if (!snapshot.exists()) {
          postsContainer.innerHTML = "<p>No posts in database yet.</p>";
          return;
        }

        snapshot.forEach((child) => {
          const p = child.val();
          const id = child.key;

          const card = document.createElement("div");
          card.className = "post-manage-card";
          card.innerHTML = `
            <div>
              <b style="color: #00ffff; font-size: 16px;">${p.title}</b>
              <br/>
              <font size="2" color="#aaaaaa">Date: ${p.date || 'N/A'} | ID: ${id}</font>
            </div>
            <div>
              <button class="btn-del" onclick="deletePost('${id}')">Delete</button>
            </div>
          `;
          postsContainer.prepend(card);
        });
      });

      // DELETE POST HELPER
      window.deletePost = function(postId) {
        if (confirm("Are you sure you want to delete this post?")) {
          remove(ref(db, `posts/${postId}`)).then(() => {
            alert("Post deleted!");
          }).catch(err => alert("Error: " + err.message));
        }
      };
    </script>
  </body>
</html>
