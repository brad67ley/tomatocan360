<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tomato Can 360 - Webmaster Blog Manager</title>
  <style>
    body {
      background-color: #000030;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1, h2 {
      font-family: "Times New Roman", Times, serif;
      margin-bottom: 5px;
    }

    .admin-window {
      background-color: #000050;
      border: 3px outset #ffffff;
      box-shadow: 4px 4px 0px #000020;
      max-width: 750px;
      margin: 20px auto;
      text-align: left;
    }

    .admin-header {
      background: linear-gradient(to right, #000066, #000099);
      border-bottom: 2px groove #ffffff;
      padding: 10px 15px;
      font-weight: bold;
      font-size: 18px;
      color: #ffff00;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-body {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #00ffff;
      margin-bottom: 4px;
    }

    input[type="text"], textarea {
      background-color: #000022;
      color: #ffffff;
      border: 2px inset #ffffff;
      padding: 6px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    .btn-action {
      background-color: #ffcc00;
      color: #000000;
      border: 3px outset #ffffff;
      font-weight: bold;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-action:active {
      border: 3px inset #ffffff;
    }

    .btn-seed {
      background-color: #c0c0c0;
      color: #000000;
      border: 2px outset #ffffff;
      font-weight: bold;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 10px;
    }

    .btn-delete {
      background-color: #ff3333;
      color: #ffffff;
      border: 2px outset #ffffff;
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .post-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background-color: #000035;
      border: 1px solid #666699;
      font-size: 13px;
    }

    .post-table th, .post-table td {
      border: 1px solid #444477;
      padding: 8px;
      text-align: left;
    }

    .post-table th {
      background-color: #000066;
      color: #ffff00;
    }

    .nav-link {
      color: #ffff00;
      text-decoration: underline;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <center>
    <h1>Tomato Can 360 <font color="#FF6347">Webmaster Panel</font></h1>
    <p><a href="blog.html" class="nav-link">&laquo; Back to Public Blog</a></p>
  </center>

  <!-- POST CREATION FORM -->
  <div class="admin-window">
    <div class="admin-header">
      <span>&#128221; Create a New Blog Post</span>
      <span style="font-size: 12px; color: #c0c0c0;">Instant Live Publishing</span>
    </div>
    <div class="admin-body">
      <form id="post-form" onsubmit="publishPost(event)">
        <div class="form-group">
          <label for="post-title">Post Title:</label>
          <input type="text" id="post-title" placeholder="e.g. Explored Downtown Today!" required />
        </div>

        <div class="form-group">
          <label for="post-author">Author Name:</label>
          <input type="text" id="post-author" value="TomatoCan360 Owner" required />
        </div>

        <div class="form-group">
          <label for="post-date">Display Date:</label>
          <input type="text" id="post-date" required />
          <small style="color: #8888aa;">(Defaults to today, but you can change it e.g. 9/7/26)</small>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="post-badge-fresh" checked />
            Include <b style="color: #ff9900;">SUPER FRESH</b> Badge
          </label>
        </div>

        <div class="form-group">
          <label for="post-body">Post Text / Body:</label>
          <textarea id="post-body" rows="6" placeholder="Write your post content here... (Line breaks are automatically preserved!)" required></textarea>
        </div>

        <button type="submit" class="btn-action">🚀 Publish Post Now</button>
      </form>
    </div>
  </div>

  <!-- EXISTING POSTS MANAGEMENT TABLE -->
  <div class="admin-window">
    <div class="admin-header">
      <span>&#128196; Published Posts on Database</span>
    </div>
    <div class="admin-body">
      <div id="posts-list-table">
        <font color="#8888aa">Loading posts...</font>
      </div>

      <hr size="1" color="#444477" style="margin-top: 20px;" />
      <p style="font-size: 12px; color: #c0c0c0;">
        <b>Need to reset or restore the original 2 posts?</b> (Keeps your old comments safe!)<br />
        <button type="button" class="btn-seed" onclick="seedDefaults()">Restore "Two Step" and "Hello" Posts</button>
      </p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBg56pode30fZyUd4Rcr8XHfXmc7rKJIgw",
      authDomain: "tomatocan360-comments.firebaseapp.com",
      databaseURL: "https://tomatocan360-comments-default-rtdb.firebaseio.com",
      projectId: "tomatocan360-comments",
      storageBucket: "tomatocan360-comments.firebasestorage.app",
      messagingSenderId: "134319569778",
      appId: "1:134319569778:web:d658fd0136447cac883beb",
      measurementId: "G-0PS9FL17FW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Auto-fill today's date in M/D/YY format
    const today = new Date();
    const formattedDate = `${today.getMonth() + 1}/${today.getDate()}/${String(today.getFullYear()).slice(-2)}`;
    document.getElementById("post-date").value = formattedDate;

    // Publish Post Function
    window.publishPost = function(e) {
      e.preventDefault();

      const title = document.getElementById("post-title").value.trim();
      const author = document.getElementById("post-author").value.trim();
      const date = document.getElementById("post-date").value.trim();
      const isFresh = document.getElementById("post-badge-fresh").checked;
      const body = document.getElementById("post-body").value.trim();

      if (!title || !body) {
        alert("Please fill in both the title and post content.");
        return;
      }

      // Generate a clean safe ID for the post
      const slug = title.toLowerCase().replace(/[^a-z0-9]/g, "").substring(0, 15);
      const postId = "post-" + (slug ? slug + "-" : "") + Date.now().toString().slice(-6);

      const postData = {
        postId: postId,
        title: title,
        author: author || "TomatoCan360 Owner",
        date: date,
        badge: isFresh ? "SUPER FRESH" : "",
        body: body,
        timestamp: Date.now()
      };

      set(ref(db, "posts/" + postId), postData)
        .then(() => {
          alert("🎉 Post published successfully! Check your blog now.");
          document.getElementById("post-title").value = "";
          document.getElementById("post-body").value = "";
          document.getElementById("post-badge-fresh").checked = true;
        })
        .catch(err => {
          alert("Error publishing post: " + err.message);
        });
    };

    // Live display of existing posts in admin table
    const postsRef = ref(db, "posts");
    onValue(postsRef, (snapshot) => {
      const container = document.getElementById("posts-list-table");
      if (!snapshot.exists()) {
        container.innerHTML = '<font color="#ff6666">No posts found in database.</font>';
        return;
      }

      let html = `
        <table class="post-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Date</th>
              <th>Title</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
      `;

      snapshot.forEach(child => {
        const post = child.val();
        const pid = post.postId || child.key;
        html += `
          <tr>
            <td><code>${pid}</code></td>
            <td>${post.date || ""}</td>
            <td><b>${post.title || "Untitled"}</b></td>
            <td>
              <button class="btn-delete" onclick="deletePost('${pid}')">Delete</button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    });

    // Delete post helper
    window.deletePost = function(postId) {
      if (confirm(`Are you sure you want to delete post '${postId}'?`)) {
        remove(ref(db, "posts/" + postId))
          .then(() => alert("Post removed!"))
          .catch(err => alert("Error: " + err.message));
      }
    };

    // Seed original 2 posts helper
    window.seedDefaults = function() {
      if (!confirm("This will ensure 'Two Step' and 'Hello' posts are created with their original IDs so all past comments show up. Continue?")) return;

      const p1 = {
        postId: "post-twostep",
        title: "Two Step Street View!",
        author: "TomatoCan360 Owner",
        date: "9/7/26",
        badge: "SUPER FRESH",
        body: "Yesterday I did street view (Car and Trekker!) in this new development called Two Step (The downtown was REALLY cool!).\nI uploaded it on Mapillary yesterday but I'm uploading it to street view studio rn!",
        timestamp: 1788785000000
      };

      const p2 = {
        postId: "post-hello-1",
        title: "Hello!",
        author: "TomatoCan360 Owner",
        date: "9/7/26",
        badge: "",
        body: "yo yo yo HELLO! this is the new blog ill put updates and photos and such here when I can and when I do!",
        timestamp: 1788780000000
      };

      Promise.all([
        set(ref(db, "posts/post-twostep"), p1),
        set(ref(db, "posts/post-hello-1"), p2)
      ]).then(() => {
        alert("Original posts restored successfully!");
      }).catch(err => alert("Error: " + err.message));
    };
  </script>

</body>
</html>
