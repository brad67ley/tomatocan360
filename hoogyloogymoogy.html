<!DOCTYPE html>
<html>
  <head>
    <title>Tomato Can 360 - Secret Admin Post Portal</title>
    <style>
      body {
        background-color: #000080;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        margin: 20px;
      }
      h1, h2, h3 {
        font-family: "Times New Roman", Times, serif;
      }
      .panel-window {
        background-color: #000050;
        border: 3px outset #ffffff;
        box-shadow: 4px 4px 0px #000020;
        max-width: 750px;
        margin: 0 auto 30px auto;
        padding: 20px;
      }
      .header-bar {
        background: linear-gradient(to right, #000033, #000066);
        border-bottom: 2px groove #ffffff;
        padding: 10px;
        margin: -20px -20px 20px -20px;
      }
      label {
        font-weight: bold;
        color: #ffff00;
        display: block;
        margin-top: 12px;
        margin-bottom: 4px;
        font-size: 14px;
      }
      input[type="text"], textarea {
        width: 97%;
        background-color: #000022;
        color: #ffffff;
        border: 2px inset #ffffff;
        padding: 8px;
        font-family: Arial, sans-serif;
        font-size: 14px;
      }
      .checkbox-container {
        margin: 15px 0;
        color: #00ffff;
        font-size: 14px;
      }
      .action-btn {
        background-color: #c0c0c0;
        color: #000000;
        border: 3px outset #ffffff;
        font-weight: bold;
        padding: 6px 20px;
        font-size: 15px;
        cursor: pointer;
      }
      .action-btn:active {
        border: 3px inset #ffffff;
      }
      .status-box {
        margin-top: 15px;
        font-weight: bold;
      }
      .post-item {
        background: #000030;
        border: 1px solid #666699;
        padding: 10px;
        margin-bottom: 10px;
      }
      .delete-btn {
        background: #ff0000;
        color: white;
        border: 2px outset #fff;
        padding: 2px 8px;
        font-size: 11px;
        cursor: pointer;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="panel-window">
      <div class="header-bar">
        <h2 style="margin: 0; color: #ff6347;">Tomato Can 360 - Secret Blog Manager</h2>
        <small style="color: #c0c0c0;">Unlisted admin page - Create posts directly to Firebase</small>
      </div>

      <form id="post-form" onsubmit="publishPost(event)">
        <label for="title">Post Title:</label>
        <input type="text" id="title" placeholder="e.g. Downtown Trekker Update!" required />

        <label for="author">Author Name:</label>
        <input type="text" id="author" value="TomatoCan360 Owner" required />

        <label for="date">Display Date (default is today):</label>
        <input type="text" id="date" />

        <div class="checkbox-container">
          <input type="checkbox" id="super-fresh" checked />
          <label for="super-fresh" style="display:inline; color:#ff9900;">Show "SUPER FRESH" badge?</label>
        </div>

        <label for="content">Post Content:</label>
        <textarea id="content" rows="9" placeholder="Write your blog post here... Line breaks will be preserved." required></textarea>

        <br /><br />
        <button type="submit" class="action-btn" id="submit-btn">Publish to Blog</button>
      </form>

      <div id="status-msg" class="status-box"></div>
    </div>

    <!-- MANAGE PREVIOUS DYNAMIC POSTS -->
    <div class="panel-window">
      <h3 style="color: #ffff00; margin-top: 0;">Manage Dynamic Posts</h3>
      <p style="font-size: 12px; color: #aaa;">Below are posts loaded from Firebase. You can delete test or unwanted posts here.</p>
      <div id="existing-posts-list">
        <font color="#8888aa">Loading posts...</font>
      </div>
    </div>

    <!-- FIREBASE MODULE SCRIPT -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
      import { getDatabase, ref, push, remove, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBg56pode30fZyUd4Rcr8XHfXmc7rKJIgw",
        authDomain: "tomatocan360-comments.firebaseapp.com",
        databaseURL: "https://tomatocan360-comments-default-rtdb.firebaseio.com",
        projectId: "tomatocan360-comments",
        storageBucket: "tomatocan360-comments.firebasestorage.app",
        messagingSenderId: "134319569778",
        appId: "1:134319569778:web:d658fd0136447cac883beb",
        measurementId: "G-0PS9FL17FW"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      // Auto-populate today's date formatted like M/D/YY
      const today = new Date();
      const formattedDate = `${today.getMonth() + 1}/${today.getDate()}/${String(today.getFullYear()).slice(-2)}`;
      document.getElementById("date").value = formattedDate;

      // Handle Post Publishing
      window.publishPost = function(event) {
        event.preventDefault();
        const submitBtn = document.getElementById("submit-btn");
        const statusMsg = document.getElementById("status-msg");

        const title = document.getElementById("title").value.trim();
        const author = document.getElementById("author").value.trim() || "TomatoCan360 Owner";
        const date = document.getElementById("date").value.trim() || formattedDate;
        const isSuperFresh = document.getElementById("super-fresh").checked;
        const content = document.getElementById("content").value.trim();

        if (!title || !content) {
          alert("Please provide both a title and content!");
          return;
        }

        submitBtn.disabled = true;
        statusMsg.innerHTML = '<font color="#ffff00">Publishing post...</font>';

        push(ref(db, "posts"), {
          title: title,
          author: author,
          date: date,
          isSuperFresh: isSuperFresh,
          content: content,
          timestamp: Date.now()
        }).then(() => {
          statusMsg.innerHTML = '<font color="#00ff00">SUCCESS: Post has been published to the blog!</font>';
          document.getElementById("title").value = "";
          document.getElementById("content").value = "";
          submitBtn.disabled = false;
        }).catch((err) => {
          statusMsg.innerHTML = `<font color="#ff3333">Error: ${err.message}</font>`;
          submitBtn.disabled = false;
        });
      };

      // Realtime list of dynamic posts with delete button
      const postsContainer = document.getElementById("existing-posts-list");
      onValue(ref(db, "posts"), (snapshot) => {
        postsContainer.innerHTML = "";

        if (!snapshot.exists()) {
          postsContainer.innerHTML = '<font color="#8888aa">No dynamic posts yet.</font>';
          return;
        }

        snapshot.forEach((child) => {
          const postKey = child.key;
          const post = child.val();

          const item = document.createElement("div");
          item.className = "post-item";
          item.innerHTML = `
            <table width="100%">
              <tr>
                <td>
                  <b style="color: #00ffff;">${post.title}</b> 
                  <span style="color: #c0c0c0; font-size: 12px;">(${post.date}) - by ${post.author}</span>
                </td>
                <td align="right">
                  <button class="delete-btn" onclick="deletePost('${postKey}')">Delete</button>
                </td>
              </tr>
            </table>
          `;
          postsContainer.prepend(item);
        });
      });

      window.deletePost = function(postKey) {
        if (confirm("Are you sure you want to delete this post?")) {
          remove(ref(db, `posts/${postKey}`)).catch((err) => {
            alert("Error deleting post: " + err.message);
          });
        }
      };
    </script>
  </body>
</html>
